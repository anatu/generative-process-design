name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        # models extra pulls the CPU-only torch wheel on linux (see [tool.uv] in pyproject)
        run: uv sync --group dev --extra models

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Import contracts
        run: uv run lint-imports

      - name: Unit + property tests
        run: |
          uv run pytest tests/unit tests/property -n auto \
            --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Integration smoke
        run: uv run pytest tests/integration -m integration

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
