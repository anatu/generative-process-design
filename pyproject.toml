[project]
name = "gpd"
version = "0.1.0"
description = "Generative process design: flowsheet corpus, validity layer, and copilot models"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "networkx>=3.5,<4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "defusedxml>=0.7",
    "duckdb>=1.0",
    "pyarrow>=16",
    "typer>=0.12",
    "httpx>=0.27",
    "sfiles2",
]

[project.optional-dependencies]
models = [
    "torch>=2.3",
    "numpy>=1.26",
]
serve = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "types-PyYAML",
]

[project.scripts]
gpd = "gpd.serve.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpd"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["*.md", "third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["gpd"]

[tool.ruff.lint.flake8-bugbear]
# typer's declarative CLI idiom
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
packages = ["gpd"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# BLUEPRINT §2.3: strict on the two load-bearing packages.
module = ["gpd.canonical.*", "gpd.validity.*"]
strict = true

[[tool.mypy.overrides]]
module = ["networkx.*", "duckdb.*", "pyarrow.*", "defusedxml.*", "Flowsheet_Class.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
    "property: Hypothesis property tests",
    "integration: end-to-end smoke tests",
    "data_quality: gates that run against a built corpus",
    "slow: excluded from the default PR run",
]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["gpd"]
branch = true
omit = ["gpd/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv.workspace]
members = [
    "third_party/SFILES2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
sfiles2 = { workspace = true }
# CI and other linux boxes get the small CPU wheel; macOS keeps the PyPI wheel (MPS).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
